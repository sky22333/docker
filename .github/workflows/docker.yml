name: 构建与发布 Docker 镜像

on:
  workflow_dispatch:
    inputs:
      image:
        description: "构建目录名称"
        required: true
        type: string
        default: "acgfaka"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: 构建并推送多架构镜像
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 检查构建目录
        run: |
          if [ ! -d "${{ inputs.image }}" ]; then
            echo "构建目录不存在: ${{ inputs.image }}"
            exit 1
          fi

          if [ ! -f "${{ inputs.image }}/Dockerfile" ]; then
            echo "Dockerfile 不存在: ${{ inputs.image }}/Dockerfile"
            exit 1
          fi

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: ./${{ inputs.image }}
          file: ./${{ inputs.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.image }}
