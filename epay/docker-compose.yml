services:
  epay:
    build: .
    container_name: epay
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - mysql

  mysql:
    image: mysql:5.7
    container_name: mysql-epay
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: myepay
      MYSQL_DATABASE: myepay
      MYSQL_USER: myepay
      MYSQL_PASSWORD: myepay
    volumes:
      - ./data/epay:/var/lib/mysql
