# 仅启用 L2TP，账号使用 chap-secrets
[modules]
log_file
chap-secrets
connlimit
l2tp
auth_mschap_v2
auth_mschap_v1
auth_chap_md5
auth_pap
ippool

[core]
log-error=/var/log/accel-ppp/core.log
thread-count=4

[ppp]
verbose=1
min-mtu=1280
mtu=1400
mru=1400
ipv4=require
ipv6=deny
lcp-echo-interval=20
lcp-echo-timeout=120

[l2tp]
verbose=1
host-name=accel-ppp
ip-pool=vpn

[dns]
dns1=8.8.8.8
dns2=1.1.1.1

[ip-pool]
gw-ip-address=10.10.0.1
10.10.0.2-254,name=vpn

[log]
log-file=/var/log/accel-ppp/accel-ppp.log
log-emerg=/var/log/accel-ppp/emerg.log
log-fail-file=/var/log/accel-ppp/auth-fail.log
level=3

[chap-secrets]
gw-ip-address=10.10.0.1
chap-secrets=/etc/ppp/chap-secrets

[cli]
tcp=127.0.0.1:2001
